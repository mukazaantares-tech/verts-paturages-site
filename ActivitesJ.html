<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAEL: Activités Jeunesse</title>
    <!-- Tailwind + FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" href="Verts-Paturages.png" type="image/png" />
    <link rel="stylesheet" href="ActivitesJ.css" />
    <link rel="stylesheet" href="darkmode.global.css" />
  </head>
  <body class="dark-enabled bg-gray-50">
    <!-- NAVBAR -->
    <header>
      <nav
        class="bg-green-700 text-white p-4 flex justify-between items-center"
      >
        <h1 class="text-xl font-bold">Verts-Pâturages: JAEL</h1>
        <!-- bouton dark mode -->
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <ul>
          <li>
            <a href="Jeunesse.html" class="hover:text-green-300">⬅ Retour</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- HERO -->
      <section
        class="bg-gradient-to-r from-purple-600 via-pink-500 to-orange-400 text-white text-center py-16"
      >
        <h1 id="youthActTitle" class="text-4xl font-extrabold mb-4"></h1>
        <p id="youthActSubtitle" class="text-lg"></p>
      </section>

      <!-- ACTIVITÉS PRINCIPALES -->
      <section
        id="youthMainActivities"
        class="max-w-6xl mx-auto py-12 px-4 grid md:grid-cols-3 gap-8"
      ></section>

      <!-- ACTIVITÉS RÉGULIÈRES -->
      <div id="youthWeeklyActivities" class="max-w-4xl mx-auto space-y-6"></div>

      <!-- ÉVÉNEMENTS SPÉCIAUX -->
      <div id="youthSpecialEvents" class="grid md:grid-cols-2 gap-8"></div>
      <!-- ================= MODAL ACTIVITÉ ================= -->

      <div
        id="activityModal"
        class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50"
      >
        <div
          class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-5xl max-h-[95vh] overflow-y-auto"
        >
          <!-- HEADER -->

          <div class="flex justify-between items-center p-6 border-b">
            <h2
              id="modalActivityTitle"
              class="text-3xl font-bold text-purple-700"
            ></h2>

            <button
              id="closeActivityModal"
              class="text-3xl font-bold hover:text-red-600"
            >
              &times;
            </button>
          </div>

          <!-- CONTENU -->

          <div class="p-6 space-y-8">
            <!-- IMAGE -->

            <img
              id="modalActivityImage"
              class="w-full rounded-xl hidden object-cover max-h-[450px]"
            />

            <!-- VIDEO -->

            <div id="modalActivityVideo"></div>

            <!-- INFORMATIONS -->

            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <strong>📂 Catégorie :</strong>

                <span id="modalCategory"></span>
              </div>

              <div>
                <strong>📅 Date :</strong>

                <span id="modalDate"></span>
              </div>

              <div>
                <strong>🕒 Heure :</strong>

                <span id="modalTime"></span>
              </div>

              <div>
                <strong>📍 Lieu :</strong>

                <span id="modalLocation"></span>
              </div>

              <div>
                <strong>État :</strong>

                <span id="modalStatus"></span>
              </div>
            </div>

            <!-- DESCRIPTION -->

            <div>
              <h3 class="text-xl font-bold mb-2">Description</h3>

              <p
                id="modalActivityDescription"
                class="text-gray-700 leading-relaxed"
              ></p>
            </div>

            <hr />

            <!-- COMMENTAIRES -->

            <div>
              <h3 class="text-2xl font-bold mb-6">💬 Commentaires</h3>

              <div id="publicComments" class="space-y-4 mb-8"></div>
            </div>

            <!-- FORMULAIRE -->

            <div id="commentFormZone" class="space-y-4">
              <input
                id="commentAuthor"
                type="text"
                placeholder="Votre nom"
                class="w-full border rounded-lg p-3"
              />

              <textarea
                id="newComment"
                rows="4"
                placeholder="Votre commentaire..."
                class="w-full border rounded-lg p-3"
              ></textarea>

              <button
                id="submitComment"
                class="bg-purple-700 text-white px-6 py-3 rounded-lg hover:bg-purple-800"
              >
                Publier 💜
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <section class="text-center py-12 bg-purple-700 text-white">
        <h2 class="text-2xl font-bold mb-4">Tu veux participer ?</h2>
        <p class="mb-6">Rejoins la Jeunesse et sers Dieu avec passion 💜</p>
        <a
          href="jeunesse.html#adhesionBtn"
          class="px-6 py-3 bg-white text-purple-700 font-bold rounded-lg hover:bg-gray-200 transition"
        >
          Faire une demande d’adhésion
        </a>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-green-700 text-white text-center p-4">
      &copy; 2024 Verts-Pâturages – JAEL
    </footer>
    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <!-- SERVICES -->
    <script src="js/services/supabase.service.js"></script>
    <script src="js/services/data.service.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/modules/public/global.responsive.js"></script>
    <script src="js/modules/global/theme.module.js"></script>
    <!-- MODULES JEUNESSE -->
    <script src="js/modules/youth/youth.activites.module.js"></script>
    <script src="js/modules/youth/youth.comments.public.module.js"></script>
    <script src="js/modules/youth/youth.adhesions.module.js"></script>
    <script src="js/modules/public/youth.public.module.js"></script>

    <!-- APP PRINCIPALE -->
    <script src="js/core/App.js"></script>
  </body>
</html>
